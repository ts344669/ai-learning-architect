services:
  - type: web
    name: ai-learning-architect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_AI_CALLS_PER_DAY
        value: "20"
      - key: MAX_AI_CALLS_PER_IP_PER_DAY
        value: "4"
